[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightup"
version = "0.1.0"
description = "Authorization-first defensive security lab orchestration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
web = ["gunicorn>=23,<24"]

[project.scripts]
lightup = "lightup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
