[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightup"
version = "0.1.0"
description = "Authorization-first defensive security lab orchestration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
web = ["gunicorn>=23,<24"]

[project.scripts]
lightup = "lightup.cli:main"
lightup-lab-fixture-replay = "lightup.lab_replay:main"
lightup-lab-score-suite = "lightup.lab_score_suite:main"
lightup-lab-score-inspect = "lightup.lab_score_inspect:main"
lightup-lab-score-compare = "lightup.lab_score_compare:main"
lightup-lab-score-calibrate = "lightup.lab_score_calibration:main"
lightup-lab-bundle-inspect = "lightup.lab_bundle_inspect:main"
lightup-lab-service-score = "lightup.lab_service_score:main"
lightup-lab-tls-score = "lightup.lab_tls_score:main"

[tool.setuptools.packages.find]
where = ["src"]
