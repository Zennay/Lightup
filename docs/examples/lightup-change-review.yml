# Example workflow for a repository that wants LightUp change reviews on PRs.
name: LightUp change review
on:
  pull_request:
permissions:
  contents: read
  security-events: write   # only needed for the SARIF upload step
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # the review needs the base commit
          persist-credentials: false
      - uses: zennay/lightup@main  # pin to a commit SHA in production
        id: lightup
        with:
          fail-on: block
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: lightup-change-review.sarif
