name: LightUp #905 exact CLI marker acceptance (non-authorizing)

on:
  push:
    branches:
      - chatgpt/scope-905-cli-policy-marker-acceptance-20261016
  pull_request:
    paths:
      - tests/test_scope_cli_policy_marker_905.py
      - docs/scope-cli-905-exact-marker-source-owner-acceptance.md
      - .github/workflows/scope-905-cli-marker-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-905-offline:
    name: Offline-only owner RED acceptance Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile isolated offline tests
        run: python -m py_compile tests/test_scope_cli_policy_marker_905.py tests/test_scope_cli_precoercion_905.py
      - name: Source-owner acceptance with known REDs
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_scope_cli*_905.py' -v
