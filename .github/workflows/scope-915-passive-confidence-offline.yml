name: LightUp #915 exact passive confidence acceptance (offline)

on:
  push:
    branches:
      - chatgpt/scope-915-canonical-confidence-acceptance-20261016
  pull_request:
    paths:
      - tests/test_scope_passive_confidence_915.py
      - docs/scope-passive-confidence-915-source-acceptance.md
      - .github/workflows/scope-915-passive-confidence-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-915-offline:
    name: Passive confidence source RED Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout exact PR head without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile independent acceptance
        run: python -m py_compile tests/test_scope_passive_confidence_915.py
      - name: Offline passive-only acceptance, known source REDs
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_scope_passive_confidence_915.py' -v
