name: ST3 impact staging VPS proof

on:
  push:
    branches:
      - chatgpt/st3-future-attack-path-impact-20261005

permissions:
  contents: read

concurrency:
  group: lightup-st3-impact-staging-vps
  cancel-in-progress: true

jobs:
  proof:
    name: ST3 impact proof Python ${{ matrix.python }}
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require canonical VPS host
        run: test "$(hostname)" = "vps-bb300bba"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile and full unit suite
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

      - name: Real producer integration
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests/integration -v

      - name: Offline activation and web canaries
        env:
          PYTHONPATH: src
        run: python scripts/check_safety_canaries.py
