name: Prune stale LightUp queued runs

on:
  push:
    branches:
      - ops/prune-stale-lightup-runs-20261005

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded queued LightUp CI runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          protected_branches = {
              "chatgpt/st3-explicit-subject-resolution-20261005",
              "chatgpt/st3-future-attack-path-impact-20261005",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return response.read()

          payload = json.loads(
              request(
                  f"https://api.github.com/repos/{repo}/actions/runs"
                  "?status=queued&per_page=100"
              )
          )
          cancelled = []
          kept = []
          for run in payload.get("workflow_runs", []):
              run_id = int(run["id"])
              name = run.get("name")
              branch = run.get("head_branch")
              if name != "LightUp CI":
                  continue
              if branch in protected_branches:
                  kept.append((run_id, branch))
                  continue
              request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel",
                  method="POST",
              )
              cancelled.append((run_id, branch))

          print(json.dumps({"cancelled": cancelled, "kept": kept}, sort_keys=True))
          if not cancelled:
              raise SystemExit("No superseded queued LightUp CI runs found")
          PY
