name: LightUp isolated Git environment review (non-authorizing)

on:
  push:
    branches:
      - chatgpt/scope-auth-git-env-fence-20261017-0115
    paths:
      - '.github/workflows/scope-git-env-attestation-20261017.yml'
      - 'scripts/scope_git_env_attestation_20261017.py'
      - 'tests/test_scope_git_env_attestation_20261017.py'
      - 'docs/scope-git-env-attestation-20261017.md'

permissions:
  contents: read

concurrency:
  group: lightup-scope-git-env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-env-fence:
    name: Read-only Git env attestation Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Checkout exact SHA without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '${{ matrix.python }}'
      - name: Verify non-authorizing Git environment before Git evidence
        run: |
          set +e
          review_out="$(python scripts/scope_git_env_attestation_20261017.py)"
          review_rc="$?"
          set -e
          test "$review_rc" -eq 2
          test "$review_out" = '{"status":"REVIEW_ONLY","authorized":false,"consent_verified":false,"dispatch_allowed":false,"release_allowed":false}'
      - name: Verify exact pushed SHA and owner branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/chatgpt/scope-auth-git-env-fence-20261017-0115
      - name: Verify separate additive ownership since pinned base
        run: |
          python - <<'PY'
          import subprocess
          base = "7b9142bb9e9d5403d7a3e41914edddef4511c8a8"
          allowed = {
              ".github/workflows/scope-git-env-attestation-20261017.yml",
              "scripts/scope_git_env_attestation_20261017.py",
              "tests/test_scope_git_env_attestation_20261017.py",
              "docs/scope-git-env-attestation-20261017.md",
          }
          raw = subprocess.check_output([
              "git", "diff", "--name-status", "-z",
              "--no-renames", base, "HEAD",
          ]).decode("ascii").split("\0")
          assert raw[-1] == ""
          records = list(zip(raw[::2], raw[1::2]))
          assert len(records) == 4
          assert all(status == "A" for status, _ in records)
          assert {name for _, name in records} == allowed
          assert subprocess.check_output([
              "git", "status", "--porcelain=v1", "--untracked-files=all",
          ]) == b""
          print("isolated_scope_git_env_additivity=PASS")
          PY
      - name: Compile and test ONLY separately owned offline files
        run: |
          python -m compileall -q scripts/scope_git_env_attestation_20261017.py tests/test_scope_git_env_attestation_20261017.py
          python -m unittest discover -s tests -p test_scope_git_env_attestation_20261017.py -q
      - name: Reattest non-authorizing Git environment after tests
        run: |
          set +e
          review_out="$(python scripts/scope_git_env_attestation_20261017.py)"
          review_rc="$?"
          set -e
          test "$review_rc" -eq 2
          test "$review_out" = '{"status":"REVIEW_ONLY","authorized":false,"consent_verified":false,"dispatch_allowed":false,"release_allowed":false}'
      - name: Verify no test changes the checkout
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
