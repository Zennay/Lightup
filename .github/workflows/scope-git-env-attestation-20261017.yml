name: LightUp isolated Git environment review (non-authorizing)

on:
  push:
    branches:
      - chatgpt/scope-git-env-main-isolated-1528-20261017
    paths:
      - '.github/workflows/scope-git-env-attestation-20261017.yml'
      - 'scripts/scope_git_env_attestation_20261017.py'
      - 'tests/test_scope_git_env_attestation_20261017.py'
      - 'scripts/check_scope_git_env_tree_20261017.py'
      - 'tests/test_scope_git_env_tree_20261017.py'
      - 'docs/scope-git-env-attestation-20261017.md'

permissions:
  contents: read

concurrency:
  group: lightup-scope-git-env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-env-fence:
    name: Read-only Git env attestation Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Checkout exact SHA without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '${{ matrix.python }}'
      - name: Verify non-authorizing Git environment before Git evidence
        run: |
          set +e
          review_out="$(python scripts/scope_git_env_attestation_20261017.py)"
          review_rc="$?"
          set -e
          test "$review_rc" -eq 2
          test "$review_out" = '{"status":"REVIEW_ONLY","authorized":false,"consent_verified":false,"dispatch_allowed":false,"release_allowed":false}'
      - name: Verify exact pushed SHA and owner branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/chatgpt/scope-git-env-main-isolated-1528-20261017
      - name: Verify exact owned additions and regular Git blob modes
        run: python scripts/check_scope_git_env_tree_20261017.py
      - name: Compile and test ONLY separately owned offline files
        run: |
          # Source compile only: compileall writes ignored bytecode and would
          # defeat the strict ignored-file evidence fence below.
          python -B -c 'from pathlib import Path; paths = ("scripts/scope_git_env_attestation_20261017.py", "tests/test_scope_git_env_attestation_20261017.py", "scripts/check_scope_git_env_tree_20261017.py", "tests/test_scope_git_env_tree_20261017.py"); [compile(Path(p).read_bytes(), p, "exec") for p in paths]'
          python -B -m unittest discover -s tests -p test_scope_git_env_attestation_20261017.py -q
          python -B -m unittest discover -s tests -p test_scope_git_env_tree_20261017.py -q
      - name: Reattest non-authorizing Git environment after tests
        run: |
          set +e
          review_out="$(python scripts/scope_git_env_attestation_20261017.py)"
          review_rc="$?"
          set -e
          test "$review_rc" -eq 2
          test "$review_out" = '{"status":"REVIEW_ONLY","authorized":false,"consent_verified":false,"dispatch_allowed":false,"release_allowed":false}'
      - name: Reverify exact owned blob modes and unchanged checkout
        run: python scripts/check_scope_git_env_tree_20261017.py
