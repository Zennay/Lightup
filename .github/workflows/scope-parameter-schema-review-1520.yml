name: Scope parameter schema review 1520 (offline)
on:
  push:
    branches:
      - chatgpt/scope-schema-duplicate-names-1520-20261016
  pull_request:
    paths:
      - 'src/lightup/scope_parameter_schema_review_1520.py'
      - 'tests/test_scope_parameter_schema_review_1520.py'
      - '.github/workflows/scope-parameter-schema-review-1520.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-schema:
    name: Offline schema Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout exact workflow ref with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pinned Python action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run only isolated no-target schema acceptance
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_scope_parameter_schema_review_1520.py' -v
