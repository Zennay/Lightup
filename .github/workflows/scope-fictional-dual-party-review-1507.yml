name: Offline fictional dual-party review 1507

on:
  push:
    branches:
      - chatgpt/scope-1507-fictional-dualparty-review-20261016
  pull_request:
    paths:
      - src/lightup/fictional_dual_party_review_1507.py
      - tests/test_fictional_dual_party_review_1507.py
      - docs/scope-fictional-dual-party-review-1507.md
      - .github/workflows/scope-fictional-dual-party-review-1507.yml

permissions:
  contents: read

jobs:
  fictional-review-only:
    name: isolated Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax and ordinary tests (synthetic only)
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/lightup/fictional_dual_party_review_1507.py tests/test_fictional_dual_party_review_1507.py
          python -m unittest discover -s tests -p 'test_fictional_dual_party_review_1507.py' -v
