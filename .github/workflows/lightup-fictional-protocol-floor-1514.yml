name: LightUp fictional protocol floor 1514 (offline only)

on:
  pull_request:
    paths:
      - "tools/fictional_protocol_floor_*_1514.py"
      - "tests/test_fictional_protocol_floor_1514.py"
      - ".github/workflows/lightup-fictional-protocol-floor-1514.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    name: Synthetic protocol-only tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Python interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile own isolated source only
        run: python -m py_compile tools/fictional_protocol_floor_review_1514.py tools/fictional_protocol_floor_cli_1514.py tests/test_fictional_protocol_floor_1514.py
      - name: Test fictional protocol downgrade rejection
        env:
          PYTHONPATH: tools
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_fictional_protocol_floor_1514.py' -v
