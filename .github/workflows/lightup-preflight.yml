name: LightUp offline preflight

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Offline preflight Python ${{ matrix.python }} (not VPS proof)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lightup, vps]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      # An ephemeral self-hosted VM is not proof of permanent-VPS execution.
      - name: Require permanent vps-bb300bba runner
        run: |
          observed="$(hostname -s)"
          if [ "$observed" != "vps-bb300bba" ]; then
            echo "::error::Wrong runner: expected vps-bb300bba, got $observed"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and unit suite
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Repeat activation and web canaries with isolated state
        env:
          PYTHONPATH: src
        run: |
          python scripts/check_safety_canaries.py
          python scripts/check_safety_canaries.py
  integration:
    # Offline diagnostics on the permanent VPS; canonical exact-head CI is still required.
    name: Real producer integration Python ${{ matrix.python }} (not VPS proof)
    needs: preflight
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lightup, vps]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      # An ephemeral self-hosted VM is not proof of permanent-VPS execution.
      - name: Require permanent vps-bb300bba runner
        run: |
          observed="$(hostname -s)"
          if [ "$observed" != "vps-bb300bba" ]; then
            echo "::error::Wrong runner: expected vps-bb300bba, got $observed"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Combined unit suite and real producer integration
        env:
          PYTHONPATH: src:tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/integration -v
      - name: State verification boundary
        run: echo "Permanent VPS offline diagnostics only. Exact-head canonical CI and independent review remain mandatory."
