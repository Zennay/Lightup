name: LightUp offline preflight

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Offline preflight Python ${{ matrix.python }} (not VPS proof)
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Zennay' && github.actor == 'Zennay')
    runs-on: [self-hosted, lightup, vps]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Require migrated permanent LightUp VPS runner
        shell: bash
        run: |
          set -euo pipefail
          observed="$(hostname -s)"
          expected="VM-7eb5ee16-2c71-440d-b7fd-8095d204e930"
          if [[ "$observed" != "$expected" || "${RUNNER_NAME:-}" != "vm-7eb5ee16-lightup" ]]; then
            echo "::error::Wrong permanent LightUp runner identity; refusing checkout"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and unit suite
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Repeat activation and web canaries with isolated state
        env:
          PYTHONPATH: src
        run: |
          python scripts/check_safety_canaries.py
          python scripts/check_safety_canaries.py
      - name: Replay loopback fixtures and persist deterministic evidence
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          store_dir="$RUNNER_TEMP/lightup-lab-fixtures-${{ github.run_id }}-${{ matrix.python }}"
          python -m lightup.lab_replay --store-dir "$store_dir"
          receipt="$(find "$store_dir" -mindepth 2 -maxdepth 2 -type f -name receipt.json -print -quit)"
          test -n "$receipt"
      - uses: actions/upload-artifact@v4
        with:
          name: lightup-lab-fixture-receipt-${{ github.run_id }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/lightup-lab-fixtures-${{ github.run_id }}-${{ matrix.python }}/*/receipt.json
            ${{ runner.temp }}/lightup-lab-fixtures-${{ github.run_id }}-${{ matrix.python }}/*/receipt.sha256
          if-no-files-found: error
          retention-days: 7
  integration:
    # Non-authorizing offline diagnostics on the dedicated permanent LightUp VPS runner.
    name: Real producer integration Python ${{ matrix.python }} (not VPS proof)
    needs: preflight
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Zennay' && github.actor == 'Zennay')
    runs-on: [self-hosted, lightup, vps]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Require migrated permanent LightUp VPS runner
        shell: bash
        run: |
          set -euo pipefail
          observed="$(hostname -s)"
          expected="VM-7eb5ee16-2c71-440d-b7fd-8095d204e930"
          if [[ "$observed" != "$expected" || "${RUNNER_NAME:-}" != "vm-7eb5ee16-lightup" ]]; then
            echo "::error::Wrong permanent LightUp runner identity; refusing checkout"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Combined unit suite and real producer integration
        env:
          PYTHONPATH: src:tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/integration -v
      - name: State verification boundary
        run: echo "Permanent VPS offline diagnostics only. Exact-head canonical CI and independent review remain mandatory."
