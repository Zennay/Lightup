name: ST5 evidence-collection request snapshot hosted validation

on:
  push:
    branches:
      - "chatgpt/st5-collection-request-snapshot-hosted-validation-20261006"
    paths:
      - ".github/workflows/st5-collection-request-snapshot-hosted-validation.yml"

permissions:
  contents: read

concurrency:
  group: st5-collection-request-snapshot-hosted-validation
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact candidate Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa1666031680a2dc9abf295a62853c69c016bce3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile exact candidate
        run: python -m compileall -q src tests
      - name: Run collection-request snapshot isolation
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_evidence_collection_request_snapshot_isolation.py' -v
      - name: Run strict collection-request handoff
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_evidence_collection_handoff.py' -v
      - name: Run real producer integration
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests/integration -v
