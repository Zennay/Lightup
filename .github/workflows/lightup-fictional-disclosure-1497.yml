name: LightUp fictional handoff quarantine #1497

on:
  push:
    branches:
      - chatgpt/scope-review-disclosure-quarantine-1497-20261016
    paths:
      - 'src/lightup/synthetic_review_disclosure_1497.py'
      - 'src/lightup/synthetic_review_disclosure_cli_1497.py'
      - 'tests/test_synthetic_review_disclosure_1497.py'
      - '.github/workflows/lightup-fictional-disclosure-1497.yml'
  pull_request:
    paths:
      - 'src/lightup/synthetic_review_disclosure_1497.py'
      - 'src/lightup/synthetic_review_disclosure_cli_1497.py'
      - 'tests/test_synthetic_review_disclosure_1497.py'
      - 'examples/fictional_review_handoff_1497.json'
      - '.github/workflows/lightup-fictional-disclosure-1497.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fictional-review-only:
    name: offline stdlib Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ordinary isolated source and actual subprocess tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_synthetic_review_disclosure_1497.py' -v
      - name: Real fictional CLI must exit review-only 2, never 0
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m lightup.synthetic_review_disclosure_cli_1497 --synthetic-only < examples/fictional_review_handoff_1497.json > /tmp/lightup-1497-offline.json
          actual=$?
          set -e
          test "$actual" -eq 2
          python -c 'import json; x=json.load(open("/tmp/lightup-1497-offline.json")); assert x["status"]=="REVIEW_ONLY" and x["authorized"] is False and x["consent_verified"] is False and x["dispatch_allowed"] is False and x["release_allowed"] is False and "NOT AUTHORIZED" in x["notice"]'
