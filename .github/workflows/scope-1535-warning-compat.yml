name: scope-1535-native-io-warning-compat
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/scope-1535-registry-warning-py314-*'
    paths:
      - 'src/lightup/capability_registry_history_report.py'
      - 'tests/test_scope_registry_warning_1535_20261017.py'
      - '.github/workflows/scope-1535-warning-compat.yml'
      - 'docs/scope-registry-warning-1535-20261017.md'
permissions:
  contents: read
concurrency:
  group: scope-1535-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact original-main branch ownership
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          base = "e73b7445c87ad239bdb03c50a99078ef93163b02"
          own_new = {
              "tests/test_scope_registry_warning_1535_20261017.py",
              ".github/workflows/scope-1535-warning-compat.yml",
              "docs/scope-registry-warning-1535-20261017.md",
          }
          own_modified = "src/lightup/capability_registry_history_report.py"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", "HEAD") == os.environ["GITHUB_SHA"]
          assert git("merge-base", base, "HEAD") == base
          actual = set(git("diff", "--name-status", base, "HEAD").splitlines())
          assert actual == {"A\t" + name for name in own_new} | {"M\t" + own_modified}, actual
          for name in sorted(own_new | {own_modified}):
              mode, kind, sha, path = git("ls-tree", "HEAD", "--", name).split(None, 3)
              assert (mode, kind, path) == ("100644", "blob", name)
              assert int(git("cat-file", "-s", sha)) <= 131072
          assert not git("status", "--porcelain=v1", "--untracked-files=all")
          print("scope1535_exact_owned_tree=PASS")
          PY
      - name: Warning-free original renderer import contract
        run: python -I -S -B -m unittest discover -s tests -p 'test_scope_registry_warning_1535_20261017.py' -v
      - name: Original report output regression contract
        run: PYTHONPATH=src python -S -B -m unittest discover -s tests -p 'test_scope_registry_history_report.py' -v
      - name: Actual eight native I/O guarded CLI integration
        run: python -I -S -B -m unittest discover -s tests -p 'test_scope_composed_native_offline_cli_20261014.py' -v
      - name: No checkout mutation after full admission checks
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'scope1535_owned_tree_after=PASS'
