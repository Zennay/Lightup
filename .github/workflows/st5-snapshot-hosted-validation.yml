name: ST5 review snapshot hosted validation

on:
  push:
    branches:
      - "chatgpt/st5-snapshot-hosted-validation-20261006"
    paths:
      - ".github/workflows/st5-snapshot-hosted-validation.yml"

permissions:
  contents: read

concurrency:
  group: st5-snapshot-hosted-validation
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact #298 Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify exact #298 candidate
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="chatgpt/st5-implementation-plan-review-snapshot-isolation-20261006"
          EXPECTED_SHA="afbbf3c6973553e46b7f74b668d2c2981939eda2"

          git fetch --no-tags origin             "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          TARGET_SHA="$(git rev-parse "refs/remotes/origin/${BRANCH}^{commit}")"
          test "${TARGET_SHA}" = "${EXPECTED_SHA}"

          TMP_ROOT="$(mktemp -d)"
          trap 'rm -rf "${TMP_ROOT}"' EXIT
          SNAPSHOT="${TMP_ROOT}/lightup"
          mkdir -p "${SNAPSHOT}"
          git archive "${TARGET_SHA}" | tar -x -C "${SNAPSHOT}"

          cd "${SNAPSHOT}"
          export PYTHONPATH=src:tests
          python -m compileall -q src tests
          python -m unittest discover -s tests             -p 'test_future_remediation_implementation_plan_review_snapshot_isolation.py' -v
          python -m unittest discover -s tests             -p 'test_future_remediation_implementation_plan_review_chain_invariant.py' -v
          python -m unittest discover -s tests/integration -v

          printf 'LIGHTUP_ST5_HOSTED_PROOF issue=298 target_sha=%s python=%s\n'             "${TARGET_SHA}" "$(python --version 2>&1)"
