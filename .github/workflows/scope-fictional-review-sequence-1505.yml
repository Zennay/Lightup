name: Scope fictional handoff sequence review 1505
on:
  pull_request:
    paths:
      - 'src/lightup/fictional_review_sequence_1505.py'
      - 'src/lightup/fictional_review_sequence_cli_1505.py'
      - 'src/lightup/fictional_review_sequence_compare_1505.py'
      - 'src/lightup/fictional_review_sequence_pair_cli_1505.py'
      - 'src/lightup/fictional_review_sequence_segments_1505.py'
      - 'src/lightup/fictional_review_sequence_segments_cli_1505.py'
      - 'src/lightup/fictional_review_sequence_anchor_1505.py'
      - 'tests/test_fictional_review_sequence_1505.py'
      - 'tests/test_fictional_review_sequence_cli_1505.py'
      - 'tests/test_fictional_review_sequence_compare_1505.py'
      - 'tests/test_fictional_review_sequence_pair_cli_1505.py'
      - 'tests/test_fictional_review_sequence_isolation_1505.py'
      - 'tests/test_fictional_review_sequence_mutations_1505.py'
      - 'tests/test_fictional_review_sequence_segments_1505.py'
      - 'tests/test_fictional_review_sequence_segments_cli_1505.py'
      - 'tests/test_fictional_review_sequence_partitions_1505.py'
      - 'tests/test_fictional_review_sequence_segments_mutations_1505.py'
      - 'tests/test_fictional_review_sequence_anchor_1505.py'
      - 'docs/scope-fictional-review-sequence-1505.md'
      - 'docs/examples/fictional-sequence-1505-*.json'
      - 'docs/examples/fictional-pair-1505-*.json'
      - 'docs/examples/fictional-segments-1505-*.json'
      - '.github/workflows/scope-fictional-review-sequence-1505.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fictional-sequence-1505-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stdlib-only ordinary fictional review and real stdin CLI tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_fictional_review_sequence*_1505.py' -v
