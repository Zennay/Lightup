name: Scope 1563 membership-before-grant offline

on:
  # Every new head commit must be checked, including a source-only intrusion.
  # Path filters here would let an unowned-only change escape the gate.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scope-1563-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  membership-no-authority:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'chatgpt/scope-1563-membership-metamorphic-20261017') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == 'chatgpt/scope-1563-membership-metamorphic-20261017')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Checkout exact untrusted branch head without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Fail closed on committed history before running project Python
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          set +e
          python3 scripts/scope_1563_exact_tree_boundary_20261017.py --expected-head "$EXACT_HEAD"
          gate_result=$?
          set -e
          test "$gate_result" -eq 3
      - name: Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Offline compile and negative-only proof
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m py_compile tests/test_scope_membership_metamorphic_20261017.py
          python -m unittest discover -s tests -p 'test_scope_membership_metamorphic_20261017.py' -v
          python scripts/scope_1563_membership_mutation_proof_20261017.py --json > "$RUNNER_TEMP/scope-1563-review.json"
          python -c '
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "scope-1563-review.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"] == "lightup.scope-1563.offline-evidence.v1"
          assert d["disposition"] == "REVIEW_ONLY"
          assert d["methods_executed"] == 16 and d["cases_passed"] == 730
          assert d["mutation_canaries_caught"] == 14
          for key in ("authority_granted", "scan_permitted", "release_approved",
                      "real_client_or_operator_consent_verified",
                      "registered_vps_ci_verified", "original_full_ci_verified",
                      "immutable_git_history_verified"):
              assert d[key] is False, key
          lines = [
              "### Scope #1563 offline evidence (REVIEW ONLY)",
              "",
              "- 16 canonical negative tests / 730 distinct input cases checked",
              "- 14 deliberate fail-open mutation classes caught by assertion",
              "- Scope membership & planner / inactive permit DENIAL only",
              "- No real client/operator consent, live grant, scan or permit",
              "- Original full CI and registered named VPS proof NOT certified",
              "- NO MERGE / NO RELEASE AUTHORITY / DRAFT HOLD",
              "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines))
          print(json.dumps(d, sort_keys=True, separators=(",", ":")))
          '
          python -m unittest discover -s tests -p 'test_scope_1563_exact_tree_boundary_20261017.py' -v
          set +e
          python scripts/scope_1563_exact_tree_boundary_20261017.py --expected-head "$EXACT_HEAD"
          result=$?
          set -e
          test "$result" -eq 3
      - name: Assert no leftover tracked/index/untracked changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
