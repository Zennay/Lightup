name: ST5 classification-review request snapshot hosted validation

on:
  push:
    branches:
      - "chatgpt/st5-classification-review-request-snapshot-hosted-validation-20261006"
    paths:
      - ".github/workflows/st5-classification-review-request-snapshot-hosted-validation.yml"

permissions:
  contents: read

concurrency:
  group: st5-classification-review-request-snapshot-hosted-validation
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact candidate Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f73a666ba172f248ced41a2d73d43956841705e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile exact candidate
        run: python -m compileall -q src tests
      - name: Run classification-review snapshot isolation
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_classification_review_request_snapshot_isolation.py' -v
      - name: Run strict classification-review request handoff
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_classification_review_request_handoff.py' -v
