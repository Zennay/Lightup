name: LightUp hosted recovery contract

on:
  push:
    branches:
      - "chatgpt/evidence-remediation-paginated-queue-sweep-20261007"
    paths:
      - ".github/workflows/lightup-hosted-recovery-contract.yml"
      - "scripts/lightup_hosted_queue_sweep.py"
      - "tests/test_lightup_hosted_queue_sweep.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact-head guard
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Queue recovery unit tests
        run: python -m unittest tests.test_lightup_hosted_queue_sweep -v
