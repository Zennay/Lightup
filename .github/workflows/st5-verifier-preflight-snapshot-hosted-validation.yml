name: ST5 verifier-preflight snapshot hosted validation

on:
  push:
    branches:
      - "chatgpt/st5-verifier-preflight-snapshot-hosted-validation-20261006"
    paths:
      - ".github/workflows/st5-verifier-preflight-snapshot-hosted-validation.yml"

permissions:
  contents: read

concurrency:
  group: st5-verifier-preflight-snapshot-hosted-validation
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact candidate Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d8783f5fcbcbcf4363abf4678559e47d001a747
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile exact candidate
        run: python -m compileall -q src tests
      - name: Run verifier-preflight snapshot isolation
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_evidence_sufficiency_verifier_preflight_snapshot_isolation.py' -v
      - name: Run strict verifier-preflight handoff
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_evidence_sufficiency_verifier_preflight_handoff.py' -v
