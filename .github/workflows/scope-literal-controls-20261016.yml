name: LightUp offline literal scope control review (non-authorizing)

on:
  push:
    branches:
      - chatgpt/scope-control-char-literal-review-20261016-2327
    paths:
      - '.github/workflows/scope-literal-controls-20261016.yml'
      - 'src/lightup/scope_literal_control_review_20261016.py'
      - 'scripts/review_scope_literal_controls_20261016.py'
      - 'tests/test_scope_literal_*20261016.py'
      - 'docs/scope-literal-control-review-20261016.md'

permissions:
  contents: read

concurrency:
  group: scope-literal-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-only:
    name: Read-only fictional scope checks Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Checkout exact pushed SHA without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Install interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '${{ matrix.python }}'
      - name: Verify exact-head checkout
        env:
          EXPECTED_HEAD: '${{ github.sha }}'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Compile own strictly offline code
        run: |
          python -m compileall -q src/lightup/scope_literal_control_review_20261016.py scripts/review_scope_literal_controls_20261016.py
          # Keep future exclusively owned test modules in the same proof lane.
          python -m compileall -q tests/test_scope_literal_*20261016.py
      - name: Offline literals and original source-RED witnesses only
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_scope_literal_*20261016.py' -v
          python -m unittest discover -s tests -p 'test_scope.py' -q
          python -m unittest discover -s tests -p 'test_activation.py' -q
          python -m unittest discover -s tests -p 'test_execution_policy.py' -q
      - name: Verify bounded CLI never grants authority
        run: |
          set +e
          good_out="$(printf '%s' '{"authorities":["fictional.example.test"]}' | python scripts/review_scope_literal_controls_20261016.py)"
          good_rc="$?"
          bad_out="$(printf '%s' '{"authorities":["local%0ahost"]}' | python scripts/review_scope_literal_controls_20261016.py)"
          bad_rc="$?"
          set -e
          test "$good_rc" -eq 2
          test "$bad_rc" -eq 3
          test "$good_out" = '{"status":"REVIEW_ONLY","authorized":false,"consent_verified":false,"dispatch_allowed":false,"release_allowed":false}'
          test "$bad_out" = '{"status":"HOLD","authorized":false,"consent_verified":false,"dispatch_allowed":false,"release_allowed":false}'
