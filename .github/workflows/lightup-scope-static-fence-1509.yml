name: LightUp isolated static CI release-fence review #1509

on:
  pull_request:
    paths:
      - 'scripts/scope_ci_static_fence_1509.py'
      - 'tests/test_scope_ci_static_fence_1509.py'
      - 'docs/scope-ci-static-fence-1509.md'
      - '.github/workflows/lightup-scope-static-fence-1509.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scope-static-fence-1509-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-static:
    name: Offline no-authority CI text review Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout exact head with no persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Only static, offline, non-authorizing tests
        run: python -m unittest discover -s tests -p 'test_scope_ci_static_fence_1509.py' -v
