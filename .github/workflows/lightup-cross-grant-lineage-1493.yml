name: LightUp scope cross-grant review 1493 (offline only)
on:
  pull_request:
    paths:
      - 'src/lightup/cross_grant_lineage_review_1493.py'
      - 'tests/test_cross_grant_lineage_review_1493.py'
      - '.github/workflows/lightup-cross-grant-lineage-1493.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-offline-review:
    name: Offline 35-method review / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile strictly owned additive modules
        run: python -m py_compile src/lightup/cross_grant_lineage_review_1493.py tests/test_cross_grant_lineage_review_1493.py
      - name: Execute exact isolated unittest inventory, no external targets
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              start_dir='tests',
              pattern='test_cross_grant_lineage_review_1493.py',
          )
          count = suite.countTestCases()
          if count != 35:
              raise SystemExit(f'ISOLATED_1493 wrong test inventory: {count}, expected 35')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print('ISOLATED_1493', {
              'tests': result.testsRun,
              'failures': len(result.failures),
              'errors': len(result.errors),
              'skips': len(result.skipped),
              'expected_failures': len(result.expectedFailures),
              'unexpected_successes': len(result.unexpectedSuccesses),
          })
          if not result.wasSuccessful() or result.testsRun != 35 or result.skipped or result.expectedFailures:
              raise SystemExit('ISOLATED_1493: HOLD (non-success or masked tests)')
          PY
