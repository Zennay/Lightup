name: LightUp hosted emergency queue sweep v2

on:
  push:
    branches:
      - "chatgpt/evidence-remediation-paginated-queue-sweep-20261007"
    paths:
      - ".github/workflows/lightup-hosted-emergency-queue-sweep-v2.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: lightup-hosted-emergency-queue-sweep-v2
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel only stale superseded LightUp CI runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          PROTECTED_EVIDENCE_SHA: "04f3f010756e7609707fda467f8ab1809f361ae4"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import time
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["RUN_ID"])
          current_sha = os.environ["SHA"]
          protected_evidence_sha = os.environ["PROTECTED_EVIDENCE_SHA"]
          now = datetime.now(timezone.utc)
          minimum_age_seconds = 2 * 60 * 60
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "lightup-hosted-emergency-queue-sweep/2",
          }

          def request(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              for attempt in range(4):
                  req = urllib.request.Request(
                      "https://api.github.com" + path,
                      data=data,
                      method=method,
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=25) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (502, 503, 504) or attempt == 3:
                          raise
                      time.sleep(1.5 * (attempt + 1))
              raise RuntimeError("unreachable GitHub request retry state")

          def paged(path_prefix, *, max_pages=20):
              items = []
              for page in range(1, max_pages + 1):
                  separator = "&" if "?" in path_prefix else "?"
                  page_items = request(
                      f"{path_prefix}{separator}per_page=100&page={page}"
                  )
                  if not isinstance(page_items, list):
                      page_items = page_items.get("workflow_runs") or []
                  items.extend(page_items)
                  if len(page_items) < 100:
                      return items, page, False
              return items, max_pages, True

          repo_info = request(f"/repos/{repo}")
          default_branch = repo_info["default_branch"]
          default_head = request(
              f"/repos/{repo}/commits/{urllib.parse.quote(default_branch, safe='')}"
          )["sha"]

          open_prs, pr_pages, pr_truncated = paged(
              f"/repos/{repo}/pulls?state=open",
              max_pages=20,
          )
          if pr_truncated:
              raise RuntimeError(
                  "open PR pagination hit safety cap; refusing to cancel any runs"
              )

          protected_shas = {default_head, current_sha, protected_evidence_sha}
          protected_prs = {}
          for pr in open_prs:
              sha = str((pr.get("head") or {}).get("sha") or "")
              if sha:
                  protected_shas.add(sha)
                  protected_prs[sha] = int(pr["number"])

          queued_runs, run_pages, run_truncated = paged(
              f"/repos/{repo}/actions/runs?status=queued",
              max_pages=10,
          )
          if run_truncated:
              raise RuntimeError(
                  "queued-run pagination hit safety cap; refusing partial sweep"
              )

          cancelled = []
          retained = []
          candidates = []

          for run in queued_runs:
              run_id = int(run["id"])
              if run_id == current_run:
                  continue
              head_sha = str(run.get("head_sha") or "")
              name = str(run.get("name") or "")
              path = str(run.get("path") or "")
              created = datetime.fromisoformat(
                  str(run["created_at"]).replace("Z", "+00:00")
              )
              age_s = int((now - created).total_seconds())

              if name != "LightUp CI" or path != ".github/workflows/lightup-ci.yml":
                  retained.append({
                      "id": run_id,
                      "reason": "not-canonical-lightup-ci",
                      "head_sha": head_sha,
                      "age_s": age_s,
                      "name": name,
                  })
                  continue

              if head_sha in protected_shas:
                  retained.append({
                      "id": run_id,
                      "reason": "current-main-open-pr-or-root-evidence-head",
                      "pr": protected_prs.get(head_sha),
                      "head_sha": head_sha,
                      "age_s": age_s,
                      "name": name,
                  })
                  continue

              if age_s < minimum_age_seconds:
                  retained.append({
                      "id": run_id,
                      "reason": "too-recent",
                      "head_sha": head_sha,
                      "age_s": age_s,
                      "name": name,
                  })
                  continue

              jobs = (
                  request(
                      f"/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page=100"
                  ).get("jobs")
                  or []
              )
              queued_self_hosted = [
                  job
                  for job in jobs
                  if str(job.get("status") or "") == "queued"
                  and "self-hosted"
                  in {str(label).lower() for label in (job.get("labels") or [])}
              ]
              if not queued_self_hosted:
                  retained.append({
                      "id": run_id,
                      "reason": "not-queued-self-hosted",
                      "head_sha": head_sha,
                      "age_s": age_s,
                      "name": name,
                  })
                  continue

              candidates.append({
                  "id": run_id,
                  "head_sha": head_sha,
                  "age_s": age_s,
                  "name": name,
                  "path": path,
                  "jobs": [
                      {
                          "id": job.get("id"),
                          "name": job.get("name"),
                          "labels": job.get("labels"),
                      }
                      for job in queued_self_hosted
                  ],
              })

          for item in candidates:
              try:
                  request(
                      f"/repos/{repo}/actions/runs/{item['id']}/cancel",
                      method="POST",
                  )
                  cancelled.append(item)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422):
                      raise
                  kept = dict(item)
                  kept["reason"] = f"cancel-http-{exc.code}"
                  retained.append(kept)

          evidence = {
              "ok": True,
              "default_branch": default_branch,
              "default_head": default_head,
              "protected_open_pr_heads": len(protected_prs),
              "protected_shas": len(protected_shas),
              "open_pr_pages": pr_pages,
              "queued_run_pages": run_pages,
              "queued_runs_scanned": len(queued_runs),
              "minimum_age_seconds": minimum_age_seconds,
              "cancelled_count": len(cancelled),
              "cancelled": cancelled,
              "retained_count": len(retained),
          }
          print("LIGHTUP_HOSTED_QUEUE_SWEEP_V2=" + json.dumps(evidence, sort_keys=True))

          payload = {
              "state": "success",
              "context": "lightup/hosted-queue-sweep-v2",
              "description": (
                  f"sweep v2 green; cancelled={len(cancelled)} protected_pr_heads={len(protected_prs)}"
              )[:140],
              "target_url": f"{os.environ['SERVER_URL']}/{repo}/actions/runs/{current_run}",
          }
          request(
              f"/repos/{repo}/statuses/{current_sha}",
              method="POST",
              payload=payload,
          )
          PY
