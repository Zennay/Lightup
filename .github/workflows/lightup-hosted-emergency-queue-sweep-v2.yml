name: LightUp hosted emergency queue sweep v2

on:
  push:
    branches:
      - "chatgpt/evidence-remediation-paginated-queue-sweep-20261007"
    paths:
      - ".github/workflows/lightup-hosted-emergency-queue-sweep-v2.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: lightup-hosted-emergency-queue-sweep-v2
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard exact recovery revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Cancel only stale superseded LightUp CI runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          PROTECTED_EVIDENCE_SHA: "04f3f010756e7609707fda467f8ab1809f361ae4"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          from scripts.lightup_hosted_queue_sweep import (
              cancellation_candidate,
              paged,
              protected_shas,
              queued_self_hosted_jobs,
          )

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["RUN_ID"])
          current_sha = os.environ["SHA"]
          protected_evidence_sha = os.environ["PROTECTED_EVIDENCE_SHA"]
          now = datetime.now(timezone.utc)
          minimum_age_seconds = 2 * 60 * 60
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "lightup-hosted-emergency-queue-sweep/2",
          }

          def request(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              for attempt in range(4):
                  req = urllib.request.Request(
                      "https://api.github.com" + path,
                      data=data,
                      method=method,
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=25) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (502, 503, 504) or attempt == 3:
                          raise
                      time.sleep(1.5 * (attempt + 1))
              raise RuntimeError("unreachable GitHub request retry state")

          repo_info = request(f"/repos/{repo}")
          default_branch = repo_info["default_branch"]
          default_head = request(
              f"/repos/{repo}/commits/{urllib.parse.quote(default_branch, safe='')}"
          )["sha"]

          open_prs, pr_pages = paged(
              request,
              f"/repos/{repo}/pulls?state=open",
              max_pages=20,
          )
          protected, protected_prs = protected_shas(
              default_head=default_head,
              current_sha=current_sha,
              explicit_evidence_sha=protected_evidence_sha,
              open_prs=open_prs,
          )

          queued_runs, run_pages = paged(
              request,
              f"/repos/{repo}/actions/runs?status=queued",
              max_pages=10,
          )

          cancelled = []
          retained = []

          for run in queued_runs:
              run_id = int(run["id"])
              if run_id == current_run:
                  continue

              head_sha = str(run.get("head_sha") or "")
              jobs = []
              preliminary, reason = cancellation_candidate(
                  run,
                  protected=protected,
                  now=now,
                  minimum_age_seconds=minimum_age_seconds,
                  jobs=[],
              )
              if reason == "not-queued-self-hosted":
                  jobs = (
                      request(
                          f"/repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page=100"
                      ).get("jobs")
                      or []
                  )
                  preliminary, reason = cancellation_candidate(
                      run,
                      protected=protected,
                      now=now,
                      minimum_age_seconds=minimum_age_seconds,
                      jobs=jobs,
                  )

              age_s = None
              created_raw = str(run.get("created_at") or "")
              if created_raw:
                  try:
                      created = datetime.fromisoformat(created_raw.replace("Z", "+00:00"))
                      age_s = int((now - created).total_seconds())
                  except ValueError:
                      pass

              item = {
                  "id": run_id,
                  "head_sha": head_sha,
                  "age_s": age_s,
                  "name": str(run.get("name") or ""),
                  "path": str(run.get("path") or ""),
              }
              if not preliminary:
                  item["reason"] = reason
                  item["pr"] = protected_prs.get(head_sha)
                  retained.append(item)
                  continue

              item["jobs"] = [
                  {
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "labels": job.get("labels"),
                  }
                  for job in queued_self_hosted_jobs(jobs)
              ]
              try:
                  request(
                      f"/repos/{repo}/actions/runs/{run_id}/cancel",
                      method="POST",
                  )
                  cancelled.append(item)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422):
                      raise
                  item["reason"] = f"cancel-http-{exc.code}"
                  retained.append(item)

          evidence = {
              "ok": True,
              "default_branch": default_branch,
              "default_head": default_head,
              "protected_open_pr_heads": len(protected_prs),
              "protected_shas": len(protected),
              "open_pr_pages": pr_pages,
              "queued_run_pages": run_pages,
              "queued_runs_scanned": len(queued_runs),
              "minimum_age_seconds": minimum_age_seconds,
              "cancelled_count": len(cancelled),
              "cancelled": cancelled,
              "retained_count": len(retained),
          }
          print("LIGHTUP_HOSTED_QUEUE_SWEEP_V2=" + json.dumps(evidence, sort_keys=True))

          payload = {
              "state": "success",
              "context": "lightup/hosted-queue-sweep-v2",
              "description": (
                  f"sweep v2 green; cancelled={len(cancelled)} protected_pr_heads={len(protected_prs)}"
              )[:140],
              "target_url": f"{os.environ['SERVER_URL']}/{repo}/actions/runs/{current_run}",
          }
          request(
              f"/repos/{repo}/statuses/{current_sha}",
              method="POST",
              payload=payload,
          )
          PY
