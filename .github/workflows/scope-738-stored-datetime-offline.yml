name: LightUp #738 stored grant datetime acceptance (offline)

on:
  push:
    branches:
      - chatgpt/scope-738-exact-grant-boundary-acceptance-20261016
  pull_request:
    paths:
      - tests/test_scope_grant_validity_subclass_738.py
      - docs/scope-grant-738-stored-datetime-source-acceptance.md
      - .github/workflows/scope-738-stored-datetime-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-738-offline:
    name: Non-authorizing grant-boundary source RED Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout exact PR head, do not persist credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile isolated tests
        run: python -m py_compile tests/test_scope_grant_validity_subclass_738.py
      - name: Exact stored-boundary owner RED acceptance
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_scope_grant_validity_subclass_738.py' -v
