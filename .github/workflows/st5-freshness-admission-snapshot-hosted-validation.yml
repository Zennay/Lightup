name: ST5 freshness-admission snapshot hosted validation

on:
  push:
    branches:
      - "chatgpt/st5-freshness-admission-snapshot-hosted-validation-20261006"
    paths:
      - ".github/workflows/st5-freshness-admission-snapshot-hosted-validation.yml"

permissions:
  contents: read

concurrency:
  group: st5-freshness-admission-snapshot-hosted-validation
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact candidate Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 568c2ff35347d0299a4e0b52f355befd7a3bca94
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile exact candidate
        run: python -m compileall -q src tests
      - name: Run freshness-admission snapshot isolation
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_evidence_freshness_admission_snapshot_isolation.py' -v
      - name: Run strict freshness-admission handoff
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_evidence_freshness_admission_handoff.py' -v
      - name: Run real producer integration
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests/integration -v
