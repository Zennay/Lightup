name: LightUp fictional packet copy review (non-authorizing #1503)

on:
  pull_request:
    paths:
      - 'src/lightup/fictional_packet_copy_1503.py'
      - 'src/lightup/fictional_packet_cli_1503.py'
      - 'tests/test_fictional_packet_copy_1503.py'
      - 'tests/test_fictional_packet_cli_1503.py'
      - 'docs/fictional_packet_copy_1503.md'
      - 'docs/examples/fictional-copy-1503.json'
      - 'docs/examples/fictional-copy-changed-1503.json'
      - 'docs/examples/fictional-copy-cli-1503.json'
      - 'docs/examples/fictional-copy-cli-held-1503.json'
      - 'docs/examples/fictional-copy-cli-pinned-1503.json'
      - 'docs/examples/fictional-copy-cli-pinned-held-1503.json'
      - '.github/workflows/lightup-fictional-packet-1503.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fictional-packet-1503-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-fictional-packet-only:
    name: Fictional-only Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Checkout isolated held head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run only synthetic byte-copy and offline CLI tests (no scans)
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_fictional_packet_copy_1503.py' -v
          python -m unittest discover -s tests -p 'test_fictional_packet_cli_1503.py' -v
