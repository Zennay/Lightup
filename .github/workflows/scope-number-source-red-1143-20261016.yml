name: Scope #1143 synthetic NUMBER source RED acceptance
on:
  push:
    branches:
      - chatgpt/scope-1143-number-source-red-20261016-2255
    paths:
      - tests/test_scope_number_source_red_1143_20261016.py
      - docs/scope-number-source-red-1143-20261016.md
      - .github/workflows/scope-number-source-red-1143-20261016.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scope-1143-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-number-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout isolated exact head without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prove immutable checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Isolated synthetic NUMBER acceptance only
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_scope_number_source_red_1143_20261016.py' -v
