name: ST5 freshness coverage snapshot hosted validation

on:
  push:
    branches:
      - "chatgpt/st5-freshness-coverage-snapshot-hosted-validation-20261006"
    paths:
      - ".github/workflows/st5-freshness-coverage-snapshot-hosted-validation.yml"

permissions:
  contents: read

concurrency:
  group: st5-freshness-coverage-snapshot-hosted-validation
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact candidate Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9d0d4fd5665c3e7c874c4eb6ed1b9f2e699a2ea
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile exact candidate
        run: python -m compileall -q src tests
      - name: Run freshness coverage snapshot isolation
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_evidence_freshness_coverage_snapshot_isolation.py' -v
      - name: Run strict freshness coverage handoff
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_security_evidence_freshness_coverage_handoff.py' -v
