name: scope-686-pinned-owner-compat-HOLD
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/scope-686-duplicate-session-cookie-contract-20261017'
    paths:
      - 'scripts/scope_686_*.py'
      - 'tests/test_scope_686_*.py'
      - 'docs/scope-686-duplicate-session-cookies.md'
      - '.github/workflows/scope-686-owner-compat.yml'
permissions:
  contents: read
concurrency:
  group: scope-686-pinned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-non-authorizing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact own add-only scope
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          base = "e73b7445c87ad239bdb03c50a99078ef93163b02"
          own = {
              "docs/scope-686-duplicate-session-cookies.md",
              "scripts/scope_686_guard_probe_offline.py",
              "scripts/scope_686_guard_mutants_offline.py",
              "scripts/scope_686_owner_composition_offline.py",
              "tests/test_scope_686_duplicate_session_cookies.py",
              "tests/test_scope_686_owner_composition_offline.py",
              ".github/workflows/scope-686-owner-compat.yml",
          }
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", "HEAD") == os.environ["GITHUB_SHA"]
          assert subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"],
                                check=False).returncode == 0
          status = set(git("diff", "--name-status", base, "HEAD").splitlines())
          assert status == {"A\t" + name for name in own}, status
          for name in own:
              mode, kind, blob, path = git("ls-tree", "HEAD", "--", name).split(None, 3)
              assert (mode, kind, path) == ("100644", "blob", name)
          assert not git("status", "--porcelain=v1", "--untracked-files=all")
          print("scope686_add_only_original_base=PASS")
          PY
      - name: Original WSGI SQLite cookie admission contract (source REDs explicitly open)
        run: PYTHONPATH=src python -B -m unittest discover -s tests -p 'test_scope_686_duplicate_session_cookies.py' -q
      - name: Independent offline reviewer fail-closed evidence contracts
        run: PYTHONPATH=src python -B -m unittest discover -s tests -p 'test_scope_686_owner_composition_offline.py' -q
      - name: Fetch only exact pinned owner objects from same GitHub repository
        shell: bash
        run: |
          for oid in \
            89c7973a330550cd5b8fad23abb54e4a81f85639 \
            8c97eb0490bc0d5d1bfdb883c9d1434f6b21749c \
            31055e7f5de9046405afea14bc945feb8f21d8be \
            f8b91596d48f318cb75050b70ccbf5a50d2cd106; do
            if ! git cat-file -e "$oid^{commit}"; then
              git -c credential.helper= fetch --quiet --no-tags origin "$oid"
            fi
            git cat-file -e "$oid^{commit}"
          done
          echo 'scope686_pinned_owners_local=PASS'
      - name: Real pinned temporary owner composition (NOT reviewed release SHA)
        shell: bash
        run: |
          python -B scripts/scope_686_owner_composition_offline.py \
            --source "$PWD" --head "$GITHUB_SHA" --mode full \
            > /tmp/scope686-HOLD-only.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/scope686-HOLD-only.json").read_text())
          assert r["status"]=="HOLD"
          assert r["release_authorized"] is False
          assert r["real_target_interaction_authorized"] is False
          assert r["candidate_compatibility"]=="PASS"
          assert len(r["optimized_mutant_checks"]) == 2
          names={x["name"]:x for x in r["checks"]}
          assert names["full_unittest"]["methods"] >= 1297
          assert names["full_unittest"]["expected_source_failures"] == 46
          assert names["integration"]["methods"] == 86
          assert r["guard_probe"]["duplicates_denied_prebody"] == 9
          print("scope686_offline_candidate=PASS; release_authorized=false; status=HOLD")
          PY
      - name: Ensure own Git working tree remains unchanged
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'scope686_no_worktree_changes=PASS; no_release_authority'
