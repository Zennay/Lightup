name: LightUp assessment-runtime lab comparison #1513 (self-hosted VPS diagnostic only)

on:
  push:
    branches:
      - chatgpt/assessment-runtime-lab-benchmark-diff-20261016
  pull_request:
    paths:
      - src/lightup/ai/assessment_runtime_diff_1513.py
      - src/lightup/ai/assessment_runtime_cohort_1513.py
      - src/lightup/ai/assessment_runtime_scenario_1513.py
      - src/lightup/ai/assessment_runtime_ground_truth_cohort_1513.py
      - tests/test_assessment_runtime_diff_1513.py
      - tests/test_assessment_runtime_cohort_1513.py
      - tests/test_assessment_runtime_integration_1513.py
      - tests/test_assessment_runtime_cli_1513.py
      - scripts/assessment_runtime_cli_options_1513.py
      - scripts/assessment_runtime_compare_cli_1513.py
      - scripts/assessment_runtime_compare_cohort_cli_1513.py
      - scripts/assessment_runtime_report_html_1513.py
      - scripts/assessment_runtime_review_bundle_inspect_cli_1513.py
      - tests/test_assessment_runtime_cohort_cli_1513.py
      - tests/test_assessment_runtime_scenario_1513.py
      - tests/test_assessment_runtime_ground_truth_cohort_1513.py
      - tests/test_assessment_runtime_ground_truth_cohort_cli_1513.py
      - scripts/assessment_runtime_ground_truth_cohort_cli_1513.py
      - .github/workflows/assessment-runtime-diff-1513.yml
  workflow_dispatch:

permissions:
  contents: read

# Only the newest diagnostic for this branch should consume permanent VPS capacity.
concurrency:
  group: assessment-runtime-1513-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline-lab-comparison:
    name: Isolated offline comparator Python ${{ matrix.python }}
    # Never execute fork-controlled PR code on the permanent self-hosted VPS.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Guard expected permanent VPS (reject disposable VM runners)
        run: |
          echo "runner_name=${RUNNER_NAME:-unknown}"
          test "$(hostname)" = "vps-bb300bba"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact assessment-runtime source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pure offline regression matrix (no workers or deployment)
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p 'test_assessment_runtime_*_1513.py' -v
