name: LightUp assessment-runtime lab comparison #1513 (hosted diagnostic only)

on:
  push:
    branches:
      - chatgpt/assessment-runtime-lab-benchmark-diff-20261016
  pull_request:
    paths:
      - src/lightup/ai/assessment_runtime_diff_1513.py
      - src/lightup/ai/assessment_runtime_cohort_1513.py
      - tests/test_assessment_runtime_diff_1513.py
      - tests/test_assessment_runtime_cohort_1513.py
      - tests/test_assessment_runtime_integration_1513.py
      - .github/workflows/assessment-runtime-diff-1513.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-lab-comparison:
    name: Isolated offline comparator Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pure offline regression matrix (no workers or deployment)
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -p 'test_assessment_runtime_*_1513.py' -v
