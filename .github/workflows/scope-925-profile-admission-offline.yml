name: LightUp #925 passive profile admission bypass acceptance

on:
  push:
    branches:
      - chatgpt/scope-925-passive-profile-bypass-acceptance-20261016
  pull_request:
    paths:
      - tests/test_scope_profile_admission_bypass_925.py
      - docs/scope-profile-925-admission-bypass-owner-acceptance.md
      - .github/workflows/scope-925-profile-admission-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-925-offline:
    name: Offline immutable profile source RED Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout exact PR head with no stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile tests
        run: python -m py_compile tests/test_scope_profile_admission_bypass_925.py tests/test_scope_profile_mutation_paths_925.py
      - name: No target operations; acceptance only
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_scope_profile*_925.py' -v
