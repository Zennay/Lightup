name: ST5 review-chain hosted validation

on:
  push:
    branches:
      - "chatgpt/st5-review-chain-hosted-validation-20261006"
    paths:
      - ".github/workflows/st5-review-chain-hosted-validation.yml"

permissions:
  contents: read

concurrency:
  group: st5-review-chain-hosted-validation
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact candidate Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c21db0396e7a2762417b4ee1c04a1d234984662d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile exact candidate
        run: python -m compileall -q src tests
      - name: Run review-chain invariant
        env:
          PYTHONPATH: src:tests
        run: |
          python -m unittest discover -s tests -p 'test_future_remediation_implementation_plan_review_chain_invariant.py' -v
      - name: Run complete unit suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
