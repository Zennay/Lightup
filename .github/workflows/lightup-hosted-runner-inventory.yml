name: LightUp hosted runner inventory

on:
  push:
    branches:
      - "chatgpt/evidence-remediation-paginated-queue-sweep-20261007"
    paths:
      - ".github/workflows/lightup-hosted-runner-inventory.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read repository self-hosted runner inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "lightup-hosted-runner-inventory/1",
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runners?per_page=100",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.loads(response.read())
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")[:500]
              print(
                  "LIGHTUP_RUNNER_INVENTORY_ACCESS="
                  + json.dumps(
                      {"ok": False, "http_status": exc.code, "body": body},
                      sort_keys=True,
                  )
              )
              raise

          runners = []
          for runner in payload.get("runners") or []:
              runners.append(
                  {
                      "id": runner.get("id"),
                      "name": runner.get("name"),
                      "os": runner.get("os"),
                      "status": runner.get("status"),
                      "busy": bool(runner.get("busy")),
                      "labels": sorted(
                          str(label.get("name"))
                          for label in (runner.get("labels") or [])
                          if label.get("name")
                      ),
                  }
              )
          matching = [
              runner
              for runner in runners
              if {"self-hosted", "zcloud", "vps"}.issubset(
                  {label.lower() for label in runner["labels"]}
              )
          ]
          evidence = {
              "ok": True,
              "total_count": payload.get("total_count"),
              "returned_count": len(runners),
              "matching_zcloud_vps_count": len(matching),
              "matching_zcloud_vps": matching,
              "all_runners": runners,
          }
          print("LIGHTUP_RUNNER_INVENTORY=" + json.dumps(evidence, sort_keys=True))
          PY
