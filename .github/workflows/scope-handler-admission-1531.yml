name: scope-1531-offline-handler-admission
on:
  push:
    branches:
      - chatgpt/scope-1531-handler-admission-review-20261017-0247
    paths:
      - scripts/scope_handler_admission_review_20261017.py
      - tests/test_scope_handler_admission_20261017.py
      - tests/test_scope_handler_admission_boundary_20261017.py
      - docs/scope-handler-admission-20261017.md
      - .github/workflows/scope-handler-admission-1531.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scope-1531-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fictional-offline-acceptance:
    if: github.repository == 'Zennay/Lightup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exclusive additive scope and run tests (4 source REDs)
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          base=e73b7445c87ad239bdb03c50a99078ef93163b02
          test "${{ github.ref_name }}" = "chatgpt/scope-1531-handler-admission-review-20261017-0247"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor "$base" HEAD
          owned=(
            '.github/workflows/scope-handler-admission-1531.yml'
            'docs/scope-handler-admission-20261017.md'
            'scripts/scope_handler_admission_review_20261017.py'
            'tests/test_scope_handler_admission_20261017.py'
            'tests/test_scope_handler_admission_boundary_20261017.py'
          )
          assert_owned_tree() {
            local expected actual file mode kind oid entry
            expected="$(printf '%s\n' "${owned[@]}" | sort)"
            actual="$(git -c diff.external= diff-tree --no-commit-id -r --no-ext-diff --name-only "$base" HEAD | sort)"
            test "$actual" = "$expected"
            # No pre-existing files may be modified, deleted or renamed.
            git -c diff.external= diff-tree --no-commit-id -r --no-ext-diff --name-status "$base" HEAD |
              awk -F '\t' 'NF != 2 || $1 != "A" { exit 1 }'
            for file in "${owned[@]}"; do
              entry="$(git ls-tree HEAD -- "$file")"
              read -r mode kind oid file_in_tree <<< "$entry"
              test "$mode" = "100644"
              test "$kind" = "blob"
              test "$file_in_tree" = "$file"
              test "$(git cat-file -s "$oid")" -le 262144
              test -f "$file" && test ! -L "$file"
            done
            echo "scope1531_additive_tree=PASS"
          }
          assert_owned_tree
          python -I -S -B -m unittest discover -s tests -p 'test_scope_handler_admission*20261017.py' -v
          assert_owned_tree
