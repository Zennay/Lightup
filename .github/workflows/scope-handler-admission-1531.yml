name: scope-1531-offline-handler-admission
on:
  push:
    branches:
      - chatgpt/scope-1531-handler-admission-review-20261017-0247
    paths:
      - scripts/scope_handler_admission_review_20261017.py
      - tests/test_scope_handler_admission_20261017.py
      - docs/scope-handler-admission-20261017.md
      - .github/workflows/scope-handler-admission-1531.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scope-1531-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fictional-offline-acceptance:
    if: github.repository == 'Zennay/Lightup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact owned source-only test scope
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "chatgpt/scope-1531-handler-admission-review-20261017-0247"
          test -f scripts/scope_handler_admission_review_20261017.py
          test -f tests/test_scope_handler_admission_20261017.py
      - name: Execute purely offline admission tests (2 known source expected failures)
        shell: bash
        run: |
          set -euo pipefail
          python -I -S -B -m unittest discover -s tests -p 'test_scope_handler_admission_20261017.py' -v
