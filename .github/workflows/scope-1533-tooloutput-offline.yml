name: scope-1533-offline-tooloutput-contract
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/scope-1533-tooloutput-contract-20261017-*'
    paths:
      - 'src/lightup/scope_tooloutput_shape_review_20261017.py'
      - 'tests/test_scope_tooloutput_shape_1533_20261017.py'
      - '.github/workflows/scope-1533-tooloutput-offline.yml'
permissions:
  contents: read
concurrency:
  group: scope-1533-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Original main and exclusive file ownership proof
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base = "e73b7445c87ad239bdb03c50a99078ef93163b02"
          expected = {
              "src/lightup/scope_tooloutput_shape_review_20261017.py",
              "tests/test_scope_tooloutput_shape_1533_20261017.py",
              ".github/workflows/scope-1533-tooloutput-offline.yml",
              "docs/scope-tooloutput-1533-20261017.md",
          }
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("merge-base", base, "HEAD") == base, "wrong original main ancestor"
          changed = git("diff", "--name-status", base, "HEAD").splitlines()
          assert set(changed) == {"A\t" + x for x in expected}, changed
          assert not git("status", "--porcelain=v1", "--untracked-files=all"), "dirty checkout"
          print("scope1533_owned_tree=PASS")
          PY
      - name: Offline review with original source REDs
        run: python -I -S -B -m unittest discover -s tests -p 'test_scope_tooloutput_shape_1533_20261017.py' -v
      - name: Strict post-fix gate must identify all six original source REDs
        shell: bash
        run: |
          set +e
          LIGHTUP_SCOPE1533_REQUIRE_SOURCE_FIX=1 python -I -S -B -m unittest discover -s tests -p 'test_scope_tooloutput_shape_1533_20261017.py' -v > "$RUNNER_TEMP/scope1533-strict-red.log" 2>&1
          status=$?
          set -e
          log="$RUNNER_TEMP/scope1533-strict-red.log"
          test "$status" -ne 0
          grep -q 'FAILED (failures=6)' "$log"
          ! grep -q 'ERROR' "$log"
          for name in nonstring_summary blank_summary nonstring_evidence_kind blank_evidence_kind mutable_payload text_payload; do
            grep -q "FAIL: test_source_red_$name " "$log"
          done
          test "$(grep -c '^AssertionError: OrchestrationError not raised$' "$log")" -eq 6
          test "$(grep -c '^FAIL: test_source_red_' "$log")" -eq 6
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'scope1533_owned_tree_after=PASS'
          echo 'six_original_source_reds=CONFIRMED; no source remediation implied'
