name: scope-1533-offline-tooloutput-contract
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/scope-1533-tooloutput-contract-20261017-*'
    paths:
      - 'src/lightup/scope_tooloutput_shape_review_20261017.py'
      - 'tests/test_scope_tooloutput_shape_1533_20261017.py'
      - '.github/workflows/scope-1533-tooloutput-offline.yml'
permissions:
  contents: read
concurrency:
  group: scope-1533-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline review with original source REDs
        run: python -I -S -B -m unittest discover -s tests -p 'test_scope_tooloutput_shape_1533_20261017.py' -v
      - name: Verify exact unresolved source RED count in strict mode
        shell: bash
        run: |
          set +e
          LIGHTUP_SCOPE1533_REQUIRE_SOURCE_FIX=1 python -I -S -B -m unittest discover -s tests -p 'test_scope_tooloutput_shape_1533_20261017.py' -v > strict-red.log 2>&1
          status=$?
          set -e
          grep -q 'FAILED (failures=6)' strict-red.log
          ! grep -q 'ERROR' strict-red.log
          test "$status" -ne 0
          echo 'six_original_source_reds=CONFIRMED; no source remediation implied'
