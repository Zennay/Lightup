name: Scope 1553 synthetic GitHub coverage (hosted only)
on:
  pull_request:
    branches: [claude/lightup-leap]
    paths:
      - src/lightup/scope_github_file_coverage_1553.py
      - tests/test_scope_github_file_coverage_1553.py
      - src/lightup/scope_github_coverage_adapter_1553.py
      - tests/test_scope_github_coverage_adapter_1553.py
      - src/lightup/scope_github_pr_pages_1553.py
      - tests/test_scope_github_pr_pages_1553.py
      - src/lightup/scope_github_observer_1553.py
      - tests/test_scope_github_observer_1553.py
      - docs/scope-github-file-coverage-1553.md
      - .github/workflows/scope-1553-github-coverage-offline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scope1553-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fictional-coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact proposed head for source isolated proof
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -f src/lightup/scope_github_file_coverage_1553.py
          test -f tests/test_scope_github_file_coverage_1553.py
          test -f src/lightup/scope_github_coverage_adapter_1553.py
          test -f tests/test_scope_github_coverage_adapter_1553.py
          test -f src/lightup/scope_github_pr_pages_1553.py
          test -f tests/test_scope_github_pr_pages_1553.py
          test -f src/lightup/scope_github_observer_1553.py
          test -f tests/test_scope_github_observer_1553.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Strict offline 148 tests, 1 original-source RED, no missing/skipped tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import sys
          import unittest
          loader = unittest.TestLoader()
          suites = (
              loader.discover("tests", pattern="test_scope_github_file_coverage_1553.py"),
              loader.discover("tests", pattern="test_scope_github_coverage_adapter_1553.py"),
              loader.discover("tests", pattern="test_scope_github_pr_pages_1553.py"),
              loader.discover("tests", pattern="test_scope_github_observer_1553.py"),
          )
          suite = unittest.TestSuite(suites)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          observed = {
              "tests": result.testsRun,
              "expected_failures": len(result.expectedFailures),
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skipped": len(result.skipped),
              "unexpected_successes": len(result.unexpectedSuccesses),
          }
          expected = {
              "tests": 148,
              "expected_failures": 1,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
              "unexpected_successes": 0,
          }
          print("SCOPE_1553_STRICT_RECEIPT", observed, flush=True)
          if observed != expected or not result.wasSuccessful():
              sys.exit("Scope #1553 strict exact-suite admission HOLD")
          PY
      - name: Ensure output cannot return release authority
        shell: bash
        run: |
          set -euo pipefail
          set +e
          printf '{}' | PYTHONPATH=src python -m lightup.scope_github_file_coverage_1553 --synthetic-only > coverage.json
          code=$?
          set -e
          test "$code" = 2
          python - <<'PY'
          import json
          result = json.load(open("coverage.json"))
          assert result["status"] == "HOLD"
          assert result["not_authorization"] is True
          assert all(result[key] is False for key in (
              "authorize", "grant", "scan", "handler", "dispatch",
              "merge", "deploy", "release"))
          PY
      - name: Ensure real adapter preview never promotes authority
        shell: bash
        run: |
          set -euo pipefail
          set +e
          printf '{}' | PYTHONPATH=src python -m lightup.scope_github_coverage_adapter_1553 --synthetic-only > adapter.json
          code=$?
          set -e
          test "$code" = 2
          python - <<'PY'
          import json
          out = json.load(open("adapter.json"))
          assert out["status"] == "HOLD"
          assert out["file_count"] == 0
          assert out["inferred_signal_count"] == 0
          assert out["not_authorization"] is True
          assert all(out[k] is False for k in (
              "authorize", "grant", "scan", "handler", "dispatch",
              "merge", "deploy", "release"))
          PY
      - name: Ensure normalized GitHub PR page preview never promotes authority
        shell: bash
        run: |
          set -euo pipefail
          set +e
          printf '{}' | PYTHONPATH=src python -m lightup.scope_github_pr_pages_1553 --synthetic-pages-only > prpages.json
          code=$?
          set -e
          test "$code" = 2
          python - <<'PY'
          import json
          out = json.load(open("prpages.json"))
          assert out["status"] == "HOLD"
          assert out["file_count"] == 0
          assert out["inferred_signal_count"] == 0
          assert out["not_authorization"] is True
          assert all(out[k] is False for k in (
              "authorize", "grant", "scan", "handler", "dispatch",
              "merge", "deploy", "release"))
          PY
