name: LightUp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: LightUp plan-only safety tests (Python ${{ matrix.python-version }})
    # Migrated per-repository runner has Linux/X64 standard labels. Custom
    # labels from the retired VPS must not leave CI indefinitely unassigned.
    # The first step pins the exact approved VM AND runner before checkout.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Guard permanent VPS runner
        run: |
          # Exact migrated LightUp runner; no checkout, tests or deployment
          # may run on another self-hosted Linux machine.
          test "$(hostname)" = "VM-7eb5ee16-2c71-440d-b7fd-8095d204e930"
          test "$RUNNER_NAME" = "vm-7eb5ee16-lightup"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          echo "Verified migrated LightUp runner identity."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Real producer integration (requires merged ST2/ST3 predecessors)
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests/integration -v

      - name: Offline activation and web canaries (isolated state)
        env:
          PYTHONPATH: src
        run: python scripts/check_safety_canaries.py
