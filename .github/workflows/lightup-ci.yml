name: LightUp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: LightUp plan-only safety tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Fail-closed public target canary
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m lightup.cli scope-check 8.8.8.8 > /tmp/lightup-scope.json
          code=$?
          set -e
          cat /tmp/lightup-scope.json
          test "$code" -eq 2
          grep -q '"allowed": false' /tmp/lightup-scope.json

      - name: Local lab plan canary
        env:
          PYTHONPATH: src
        run: |
          python -m lightup.cli plan 127.0.0.1 > /tmp/lightup-plan.json
          cat /tmp/lightup-plan.json
          grep -q '"execution_enabled": false' /tmp/lightup-plan.json
