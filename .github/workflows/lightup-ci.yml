name: LightUp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: LightUp plan-only safety tests (Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Zennay' && github.actor == 'Zennay')
    runs-on: [self-hosted, lightup, vps]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Guard migrated permanent LightUp VPS runner
        shell: bash
        run: |
          set -euo pipefail
          observed="$(hostname -s)"
          expected="VM-7eb5ee16-2c71-440d-b7fd-8095d204e930"
          if [[ "$observed" != "$expected" || "${RUNNER_NAME:-}" != "vm-7eb5ee16-lightup" ]]; then
            echo "::error::Wrong permanent LightUp runner identity; refusing checkout"
            exit 1
          fi
          echo "Verified permanent LightUp VPS runner"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q src tests

      - name: Offline receipt custody smoke (synthetic fixtures only)
        run: python assessment-runtime-receipt/check_contract.py

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Real producer integration (requires merged ST2/ST3 predecessors)
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests/integration -v

      - name: Offline activation and web canaries (isolated state)
        env:
          PYTHONPATH: src
        run: python scripts/check_safety_canaries.py
