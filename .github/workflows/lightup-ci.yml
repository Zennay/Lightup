name: LightUp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: LightUp plan-only safety tests (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, zcloud, vps]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Guard permanent VPS runner
        run: |
          test "$(hostname)" = "vps-bb300bba"
          echo "runner_host=$(hostname)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Real producer integration (requires merged ST2/ST3 predecessors)
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests/integration -v

      - name: Offline activation and web canaries (isolated state)
        env:
          PYTHONPATH: src
        run: python scripts/check_safety_canaries.py
