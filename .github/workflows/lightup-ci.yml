name: LightUp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: LightUp plan-only safety tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Fail-closed public target canary
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m lightup.cli scope-check 8.8.8.8 > /tmp/lightup-scope.json
          code=$?
          set -e
          cat /tmp/lightup-scope.json
          test "$code" -eq 2
          grep -q '"allowed": false' /tmp/lightup-scope.json

      - name: Local lab plan canary
        env:
          PYTHONPATH: src
        run: |
          python -m lightup.cli plan 127.0.0.1 > /tmp/lightup-plan.json
          cat /tmp/lightup-plan.json
          grep -q '"execution_enabled": false' /tmp/lightup-plan.json

      - name: Model gateway canary (offline default, fail-closed credentials)
        env:
          PYTHONPATH: src
        run: |
          # Default config: every role bound to the scripted provider, offline.
          python -m lightup.cli gateway-check > /tmp/lightup-gw.json
          cat /tmp/lightup-gw.json
          python - <<'EOF'
          import json
          data = json.load(open("/tmp/lightup-gw.json"))
          assert data["ok"] is True, data
          roles = data["bindings"]
          expected = {"planner", "surface_analyst", "security_analyst",
                      "verifier", "remediation_advisor", "report_synthesizer"}
          assert set(roles) == expected, roles
          assert all(b["provider"] == "scripted" for b in roles.values()), roles
          print("default gateway canary: OK")
          EOF
          # A real-provider config with no credential in the environment must
          # fail closed, never silently fall back to a stub.
          cat > /tmp/lightup-models.json <<'JSON'
          {"providers":[{"id":"p","kind":"anthropic","api_key_env":"LIGHTUP_MISSING_KEY"}],
           "roles":{"planner":{"provider":"p","model":"m"},
                    "surface_analyst":{"provider":"p","model":"m"},
                    "security_analyst":{"provider":"p","model":"m"},
                    "verifier":{"provider":"p","model":"m"},
                    "remediation_advisor":{"provider":"p","model":"m"},
                    "report_synthesizer":{"provider":"p","model":"m"}}}
          JSON
          set +e
          LIGHTUP_MODEL_CONFIG=/tmp/lightup-models.json \
            python -m lightup.cli gateway-check > /tmp/lightup-gw-fail.json
          code=$?
          set -e
          cat /tmp/lightup-gw-fail.json
          test "$code" -eq 2
          grep -q '"ok": false' /tmp/lightup-gw-fail.json

      - name: Web shell canary (auth required, stays locked, loopback-only)
        env:
          PYTHONPATH: src
        run: |
          python - <<'EOF'
          import io
          from lightup.domain import DomainStore
          from lightup.webapp import create_app
          from lightup.webapp.__main__ import _loopback

          store = DomainStore("/tmp/lightup-web.db")
          app = create_app(store)

          def get(path, cookie=None):
              env = {"REQUEST_METHOD": "GET", "PATH_INFO": path,
                     "wsgi.input": io.BytesIO(b"")}
              if cookie:
                  env["HTTP_COOKIE"] = cookie
              out = {}
              body = b"".join(app(env, lambda s, h: out.update(status=s, headers=dict(h))))
              return out["status"], out["headers"], body.decode()

          # Anonymous access is redirected to the login page.
          status, headers, _ = get("/")
          assert status == "303 See Other" and headers["Location"] == "/login", (status, headers)

          # A signed-in operator sees the locked activation state.
          user = store.bootstrap_operator("ci@lightup.test", "CI", "ci-canary-password")
          token, _csrf = store.create_session(user.user_id)
          status, _, body = get("/", cookie=f"lightup_session={token}")
          assert status == "200 OK", status
          assert "Locked" in body and "no real-target execution path" in body

          try:
              _loopback("0.0.0.0")
          except Exception:
              print("non-loopback bind refused: OK")
          else:
              raise SystemExit("web shell accepted a non-loopback bind")
          print("web shell canary: OK")
          EOF
