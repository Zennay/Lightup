name: LightUp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: LightUp plan-only safety tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Fail-closed public target canary
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m lightup.cli scope-check 8.8.8.8 > /tmp/lightup-scope.json
          code=$?
          set -e
          cat /tmp/lightup-scope.json
          test "$code" -eq 2
          grep -q '"allowed": false' /tmp/lightup-scope.json

      - name: Local lab plan canary
        env:
          PYTHONPATH: src
        run: |
          python -m lightup.cli plan 127.0.0.1 > /tmp/lightup-plan.json
          cat /tmp/lightup-plan.json
          grep -q '"execution_enabled": false' /tmp/lightup-plan.json

      - name: Web shell canary (renders, stays locked, loopback-only)
        env:
          PYTHONPATH: src
        run: |
          python - <<'EOF'
          import io
          from lightup.domain import DomainStore
          from lightup.webapp import create_app
          from lightup.webapp.__main__ import _loopback

          app = create_app(DomainStore("/tmp/lightup-web.db"))
          env = {"REQUEST_METHOD": "GET", "PATH_INFO": "/", "wsgi.input": io.BytesIO(b"")}
          out = {}
          body = b"".join(app(env, lambda s, h: out.update(status=s))).decode()
          assert out["status"] == "200 OK", out
          assert "Locked" in body and "no real-target execution path" in body
          try:
              _loopback("0.0.0.0")
          except Exception:
              print("non-loopback bind refused: OK")
          else:
              raise SystemExit("web shell accepted a non-loopback bind")
          print("web shell canary: OK")
          EOF
