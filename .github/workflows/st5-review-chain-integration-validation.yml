name: ST5 review-chain integration validation

on:
  push:
    branches:
      - "chatgpt/st5-review-chain-hosted-validation-20261006"
    paths:
      - ".github/workflows/st5-review-chain-integration-validation.yml"

permissions:
  contents: read

concurrency:
  group: st5-review-chain-integration-validation
  cancel-in-progress: true

jobs:
  exact-candidate:
    name: Exact candidate integration Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 49bd9bfad549bf327df69af058e9c802fd7599d4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile exact candidate
        run: python -m compileall -q src tests
      - name: Run downstream review-chain invariant
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests -p 'test_future_remediation_implementation_plan_review_chain_invariant.py' -v
      - name: Run real producer integration
        env:
          PYTHONPATH: src:tests
        run: python -m unittest discover -s tests/integration -v
