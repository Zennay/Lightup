name: LightUp #741 exact direct grant identity (non-authorizing)

on:
  push:
    branches:
      - chatgpt/scope-741-direct-grant-identity-acceptance-20261016
  pull_request:
    paths:
      - tests/test_scope_direct_grant_identity_741.py
      - docs/scope-direct-grant-741-source-owner-acceptance.md
      - .github/workflows/scope-741-direct-grant-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Offline grant identity RED Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout exact head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile offline acceptance test
        run: python -m py_compile tests/test_scope_direct_grant_identity_741.py
      - name: Verify known source RED contracts
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_scope_direct_grant_identity_741.py' -v
