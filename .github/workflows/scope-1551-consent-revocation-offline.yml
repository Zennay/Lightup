name: Scope 1551 fictional consent-revocation review (hosted only)

on:
  pull_request:
    paths:
      - 'scripts/review_scope_consent_revocation_1551_offline.py'
      - 'scripts/review_scope_consent_timeline_1551_offline.py'
      - 'tests/test_scope_consent_revocation_1551_offline.py'
      - 'tests/test_scope_consent_timeline_1551_offline.py'
      - 'docs/scope-1551-two-party-revocation-review-20261017.md'
      - '.github/workflows/scope-1551-consent-revocation-offline.yml'

permissions:
  contents: read

jobs:
  offline-only:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }} && ${{ github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Checkout exact same-repository PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify pinned original base, exact SHA and exclusive new file ownership
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          base=e73b7445c87ad239bdb03c50a99078ef93163b02
          git merge-base --is-ancestor "$base" HEAD
          test -z "$(git diff --name-only --diff-filter=MDRT "$base"...HEAD)"
          git diff --name-only --diff-filter=A "$base"...HEAD | sort > /tmp/lightup1551.actual
          printf '%s\n' \
            .github/workflows/scope-1551-consent-revocation-offline.yml \
            docs/scope-1551-two-party-revocation-review-20261017.md \
            scripts/review_scope_consent_revocation_1551_offline.py \
            scripts/review_scope_consent_timeline_1551_offline.py \
            tests/test_scope_consent_revocation_1551_offline.py \
            tests/test_scope_consent_timeline_1551_offline.py | sort > /tmp/lightup1551.expected
          diff -u /tmp/lightup1551.expected /tmp/lightup1551.actual
          while IFS= read -r path; do
            test "$(git ls-tree HEAD -- "$path" | cut -d ' ' -f1)" = 100644
          done < /tmp/lightup1551.expected
      - name: Offline synthetic unit and CLI acceptance
        run: python -I -S -B -m unittest discover -s tests -p 'test_scope_consent_*1551_offline.py' -v
      - name: Original non-target producer integration
        env:
          PYTHONPATH: src:tests:.
        run: python -S -B -m unittest discover -s tests/integration -p 'test_*.py' -q
