name: Scope 1547 synthetic Git status integrity (hosted only)
on:
  pull_request:
    paths:
      - "scripts/review_scope_git_status_synthetic_1547.py"
      - "tests/test_scope_1547_synthetic_git_status.py"
      - "docs/scope-1547-git-status-atomic-hold-20261017.md"
      - ".github/workflows/scope-1547-git-status-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          # Inspect exactly this worker's branch, never GitHub's synthetic
          # PR merge ref that may contain the moving source owner's code.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Confirm own paths, source parent and exact branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor c37b909907fc7291cb28b2f37a78db7f2fea2855 HEAD
          git diff --name-only c37b909907fc7291cb28b2f37a78db7f2fea2855 HEAD | sort > /tmp/scope1547-actual.txt
          printf "%s\n" ".github/workflows/scope-1547-git-status-offline.yml" "docs/scope-1547-git-status-atomic-hold-20261017.md" "scripts/review_scope_git_status_synthetic_1547.py" "tests/test_scope_1547_synthetic_git_status.py" > /tmp/scope1547-expected.txt
          diff -u /tmp/scope1547-expected.txt /tmp/scope1547-actual.txt
          echo "scope1547_exact_owner_paths=PASS"
      - name: Compile only own Python files
        shell: bash
        run: |
          python -W error::SyntaxWarning -B -m py_compile scripts/review_scope_git_status_synthetic_1547.py tests/test_scope_1547_synthetic_git_status.py
      - name: Tests (source-owner REDs remain explicitly expected)
        shell: bash
        run: |
          PYTHONPATH=src:tests python -I -S -B -m unittest discover -s tests -p test_scope_1547_synthetic_git_status.py -v
      - name: Report advisory-only HOLD on release
        run: echo "INCUBATE M3/M7 — offline REVIEW_ONLY, never consent, grant, merge or deployment"

  source-owner-acceptance:
    # A separately RED gate is deliberate while the owner's source is broken.
    # This runs only on GitHub-hosted Ubuntu, NEVER the permanent VPS runner.
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check current source owner without writing to owner branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          owner_ref="refs/remotes/origin/claude/lightup-leap"
          owner_sha="$(git rev-parse --verify "$owner_ref^{commit}")"
          git merge-base --is-ancestor c37b909907fc7291cb28b2f37a78db7f2fea2855 "$owner_sha"
          echo "scope1547_source_owner_sha=$owner_sha"
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          # Only copy the own PR's source tree and test harness to a disposable
          # checkout; use raw git show to avoid executing source-owner filters.
          cp -R src "$tempdir/src"
          mkdir -p "$tempdir/tests" "$tempdir/scripts"
          cp tests/test_scope_1547_synthetic_git_status.py "$tempdir/tests/"
          cp scripts/review_scope_git_status_synthetic_1547.py "$tempdir/scripts/"
          git show "$owner_sha:src/lightup/git_changes.py" > "$tempdir/src/lightup/git_changes.py"
          (
            cd "$tempdir"
            LIGHTUP_SCOPE1547_REQUIRE_SOURCE_FIX=1 PYTHONPATH=src:tests \
              python -S -B -m unittest \
              test_scope_1547_synthetic_git_status.StrictSourceOwnerGate.test_source_rejects_all_five_original_invalid_forms -v
          )
      - name: Source-owner status is review-only, never an authority grant
        run: echo "Source acceptance alone cannot authorize merge, scan, grant, release or deployment"
